name: NES 80A bootloader build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Build CAN bootloader (16KB layout)
        run: make -j8 AM32_L431_BOOTLOADER_NES80A_CAN

      - name: Build PWM/DShot bootloader (4KB PA2)
        run: make -j8 AM32_L431_BOOTLOADER_PA2

      - name: Show sizes
        if: always()
        run: ls -la obj/ | grep -iE "NES80A|PA2" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NES-80A-bootloader-hex
          path: |
            obj/AM32_L431_BOOTLOADER_NES80A_CAN_*.hex
            obj/AM32_L431_BOOTLOADER_PA2_*.hex
          retention-days: 90

      - name: Update rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nes80a-latest
          name: NES 80A bootloader - latest build
          body: |
            Auto build. branch `${{ github.ref_name }}`, commit `${{ github.sha }}`

            | file | layout | matching firmware |
            |---|---|---|
            | AM32_L431_BOOTLOADER_PA2_V19.hex | 4KB, app @0x08001000 | AM32_NES_80A_L431_2.22.hex |
            | AM32_L431_BOOTLOADER_NES80A_CAN_V19.hex | 16KB, app @0x08004000 | AM32_NES_80A_L431_CAN_2.22.hex |

            Do not mix the two pairs. Flash order: bootloader first.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            obj/AM32_L431_BOOTLOADER_NES80A_CAN_*.hex
            obj/AM32_L431_BOOTLOADER_PA2_*.hex
